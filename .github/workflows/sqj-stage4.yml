name: SQJ Stage 4 evidence decision study

on:
  push:
    branches: [research/sqj-stage4-evidence-policy]
  workflow_dispatch:

jobs:
  stage4:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Source integrity and pre-registered rules
        run: |
          python scripts/check_utf8.py
          python scripts/check_public_release.py
          python scripts/verify_manifest.py
          python -m compileall -q bench
          python -m unittest bench.test_stage4_evidence_policy -v
      - name: Run isolated Go scripted validation (not real LLM)
        run: |
          python -m bench.stage4_evidence_policy --mode scripted --repeats 2 --seed 20261124 --output results/stage4_ci
      - name: Archive all raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-scripted-evidence
          path: results/stage4_ci/
          if-no-files-found: warn
          retention-days: 30
