name: Codex MCP RAGuard local pilot

on:
  push:
    branches: [research/codex-mcp-pilot]
  workflow_dispatch:

jobs:
  pilot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Integrity, plugin and real Go HTTP tests
        shell: bash
        run: |
          python scripts/check_utf8.py
          python scripts/check_public_release.py
          python scripts/verify_manifest.py
          python -m compileall -q integrations bench scripts
          python -m unittest bench.test_codex_mcp_pilot -v
          python -m scripts.codex_mcp_wire_smoke --output results/codex_mcp_wire_smoke.json
          cd mock
          go test ./...
      - name: Archive raw protocol and physical effect evidence
        uses: actions/upload-artifact@v4
        with:
          name: codex-mcp-wire-smoke-${{ matrix.os }}
          path: results/codex_mcp_wire_smoke.json*
          if-no-files-found: error
          retention-days: 30
