name: Audited recovery repeated evidence

on:
  push:
    branches: [research/sqj-audited-repeats]
  workflow_dispatch:

jobs:
  paired-study:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check source hashes and audit tests
        run: |
          python scripts/verify_manifest.py
          python -m unittest bench.test_audited_recovery_repeats -v
          python -m unittest bench.test_audited_recovery_http -v
      - name: Run independent Go HTTP sandboxes
        run: |
          python -m bench.audited_recovery_repeats --repeats 3 --seed 20261123 --output results/audited_recovery_repeats_ci
      - name: Archive complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-recovery-repeats-ci
          path: results/audited_recovery_repeats_ci/
          if-no-files-found: warn
          retention-days: 30
