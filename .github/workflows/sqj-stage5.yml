name: SQJ Stage 5 contract boundary

on:
  push:
    branches: [research/sqj-stage5-contract-boundary]
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Source and policy integrity
        run: |
          python scripts/check_utf8.py
          python scripts/check_public_release.py
          python scripts/verify_manifest.py
          python -m compileall -q bench raguard
          python -m unittest bench.test_stage5_contract_boundary -v
          cd mock
          go test ./...
          go vet ./...
      - name: Real Go contract boundary experiment
        run: |
          python -m bench.stage5_contract_boundary --repeats 2 --seed 20261124 --output results/stage5_ci
      - name: Archive raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-contract-go-evidence
          path: results/stage5_ci/
          retention-days: 30
          if-no-files-found: warn
